<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ddbfb"/>
      <stop offset="60%" stop-color="#bee5fc"/>
      <stop offset="100%" stop-color="#ddf1fe"/>
    </linearGradient>
    <clipPath id="clip1">
      <circle cx="256" cy="256" r="202"/>
    </clipPath>
  </defs>
  <style>
    .stroke-main { stroke: #1b3554; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .stroke-thick { stroke: #1b3554; stroke-width: 7.5; stroke-linecap: round; stroke-linejoin: round; }
    .stroke-thin { stroke: #1b3554; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .stroke-white { stroke: #ffffff; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .fill-navy { fill: #1b3554; }
    .fill-ochre { fill: #de783b; }
    .fill-ochre-light { fill: #ea8a4e; }
    .fill-stone { fill: #f2ebd9; }
    .fill-stone-dark { fill: #dfd6be; }
    .fill-sun { fill: #ffd154; }
    .fill-cloud { fill: #ffffff; }
    .fill-water { fill: #26b9e7; }
    .fill-water-deep { fill: #1ba0cc; }
  </style>

  <g clip-path="url(#clip1)">
    <!-- Cielo -->
    <circle cx="256" cy="256" r="202" fill="url(#skyGrad1)"/>

    <!-- Sol puro -->
    <circle cx="200" cy="155" r="58" class="fill-sun"/>

    <!-- Nube meteorológica blanca pura sin trazo -->
    <g class="fill-cloud">
      <circle cx="280" cy="175" r="32"/>
      <circle cx="330" cy="142" r="44"/>
      <circle cx="400" cy="146" r="46"/>
      <circle cx="435" cy="188" r="32"/>
      <rect x="275" y="160" width="160" height="45"/>
    </g>

    <!-- Gotas de lluvia puras -->
    <path d="M 360 205 C 360 205 352 217 352 223 C 352 228 356 231 360 231 C 364 231 368 228 368 223 C 368 217 360 205 360 205 Z" class="fill-water"/>
    <path d="M 395 210 C 395 210 387 222 387 228 C 387 233 391 236 395 236 C 399 236 403 233 403 228 C 403 222 395 210 395 210 Z" class="fill-water"/>
    <path d="M 378 238 C 378 238 371 249 371 254 C 371 258 374 261 378 261 C 382 261 385 258 385 254 C 385 249 378 238 378 238 Z" class="fill-water"/>

    <!-- Barandilla metálica sobre el muro -->
    <g>
      <line x1="50" y1="230" x2="462" y2="230" class="stroke-main"/>
      <line x1="50" y1="244" x2="462" y2="244" class="stroke-main"/>
      <!-- Barrotes -->
      <line x1="75" y1="230" x2="75" y2="244" class="stroke-thin"/>
      <line x1="100" y1="230" x2="100" y2="244" class="stroke-thin"/>
      <line x1="125" y1="230" x2="125" y2="244" class="stroke-thin"/>
      <line x1="385" y1="230" x2="385" y2="244" class="stroke-thin"/>
      <line x1="410" y1="230" x2="410" y2="244" class="stroke-thin"/>
      <line x1="435" y1="230" x2="435" y2="244" class="stroke-thin"/>
      <!-- Pilar de piedra superior -->
      <rect x="330" y="210" width="28" height="34" class="fill-stone stroke-main"/>
      <polygon points="326,210 362,210 360,204 328,204" class="fill-stone-dark stroke-thin"/>
    </g>

    <!-- Muro Ocre / Terracota de la Fuente con gradas horizontales -->
    <rect x="40" y="244" width="432" height="230" class="fill-ochre stroke-main"/>
    <line x1="40" y1="290" x2="472" y2="290" class="stroke-thin" stroke="#c06028"/>
    <line x1="40" y1="340" x2="472" y2="340" class="stroke-thin" stroke="#c06028"/>

    <!-- Pilastras laterales de piedra -->
    <rect x="110" y="325" width="46" height="110" class="fill-stone stroke-main"/>
    <polygon points="106,325 160,325 156,318 110,318" class="fill-stone-dark stroke-thin"/>

    <rect x="356" y="325" width="46" height="110" class="fill-stone stroke-main"/>
    <polygon points="352,325 406,325 402,318 356,318" class="fill-stone-dark stroke-thin"/>

    <!-- Arco Monumental de la Fuente del Caño -->
    <g>
      <!-- Arco exterior de piedra -->
      <path d="M 148 420 L 148 355 A 108 108 0 0 1 364 355 L 364 420 Z" class="fill-stone stroke-thick"/>
      
      <!-- Líneas de las Dovelas del arco -->
      <!-- Dovela central (clave) -->
      <line x1="256" y1="247" x2="256" y2="280" class="stroke-thin"/>
      <line x1="215" y1="255" x2="225" y2="285" class="stroke-thin"/>
      <line x1="297" y1="255" x2="287" y2="285" class="stroke-thin"/>
      <line x1="178" y1="280" x2="198" y2="304" class="stroke-thin"/>
      <line x1="334" y1="280" x2="314" y2="304" class="stroke-thin"/>
      <line x1="152" y1="320" x2="182" y2="332" class="stroke-thin"/>
      <line x1="360" y1="320" x2="330" y2="332" class="stroke-thin"/>

      <!-- Niche / Frontis interior del arco -->
      <path d="M 180 420 L 180 355 A 76 76 0 0 1 332 355 L 332 420 Z" class="fill-stone-dark stroke-main"/>
      
      <!-- Sillería / Bloques de piedra interiores -->
      <line x1="180" y1="345" x2="332" y2="345" stroke="#c8bea6" stroke-width="2.5"/>
      <line x1="180" y1="380" x2="332" y2="380" stroke="#c8bea6" stroke-width="2.5"/>
      <line x1="230" y1="345" x2="230" y2="380" stroke="#c8bea6" stroke-width="2"/>
      <line x1="282" y1="345" x2="282" y2="380" stroke="#c8bea6" stroke-width="2"/>
      <line x1="256" y1="315" x2="256" y2="345" stroke="#c8bea6" stroke-width="2"/>

      <!-- Plaquita central histórica -->
      <rect x="242" y="322" width="28" height="15" rx="1.5" class="fill-stone stroke-thin"/>
      <line x1="246" y1="327" x2="266" y2="327" stroke="#1b3554" stroke-width="1.5"/>
      <line x1="248" y1="332" x2="264" y2="332" stroke="#1b3554" stroke-width="1.5"/>
    </g>

    <!-- Pilón / Pila de Agua -->
    <rect x="140" y="416" width="232" height="45" class="fill-stone stroke-main"/>
    <rect x="146" y="420" width="220" height="25" class="fill-water-deep stroke-thin"/>
    <!-- Brillo del agua en el pilón -->
    <line x1="155" y1="428" x2="355" y2="428" stroke="#77e0ff" stroke-width="3" stroke-linecap="round"/>

    <!-- Los 5 Caños Dorados y Chorros de Agua -->
    <!-- Caño 1 -->
    <circle cx="196" cy="385" r="4.5" class="fill-sun stroke-thin"/>
    <path d="M 196 388 Q 198 405 200 424" stroke="#26b9e7" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Caño 2 -->
    <circle cx="226" cy="385" r="4.5" class="fill-sun stroke-thin"/>
    <path d="M 226 388 Q 227 405 228 424" stroke="#26b9e7" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Caño 3 (Central) -->
    <circle cx="256" cy="385" r="5" class="fill-sun stroke-thin"/>
    <path d="M 256 388 L 256 424" stroke="#26b9e7" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Caño 4 -->
    <circle cx="286" cy="385" r="4.5" class="fill-sun stroke-thin"/>
    <path d="M 286 388 Q 285 405 284 424" stroke="#26b9e7" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Caño 5 -->
    <circle cx="316" cy="385" r="4.5" class="fill-sun stroke-thin"/>
    <path d="M 316 388 Q 314 405 312 424" stroke="#26b9e7" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Salpicaduras / ondas en el agua -->
    <ellipse cx="200" cy="425" rx="5" ry="2" fill="#ffffff"/>
    <ellipse cx="228" cy="425" rx="5" ry="2" fill="#ffffff"/>
    <ellipse cx="256" cy="425" rx="6" ry="2.5" fill="#ffffff"/>
    <ellipse cx="284" cy="425" rx="5" ry="2" fill="#ffffff"/>
    <ellipse cx="312" cy="425" rx="5" ry="2" fill="#ffffff"/>

    <!-- Hitos / Guardacantones de piedra en primer plano -->
    <polygon points="124,475 132,410 144,410 152,475" class="fill-stone stroke-main"/>
    <polygon points="248,475 252,408 260,408 264,475" class="fill-stone stroke-main"/>
    <polygon points="360,475 368,410 380,410 388,475" class="fill-stone stroke-main"/>
  </g>

  <!-- Borde circular exterior -->
  <circle cx="256" cy="256" r="202" fill="none" class="stroke-white" stroke="#ffffff" stroke-width="8"/>
</svg>